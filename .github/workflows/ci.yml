name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 8000
      MONGO_URI: mongodb://127.0.0.1:27017/projectcamp_test
      ACCESS_TOKEN_SECRET: test_access_token_secret_min_32_characters_long
      REFRESH_TOKEN_SECRET: test_refresh_token_secret_min_32_characters_long
      ACCESS_TOKEN_EXPIRY: 1d
      REFRESH_TOKEN_EXPIRY: 10d
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: node -c src/server.js src/app.js src/db/index.js

      - name: Run Automated Tests
        run: npm test

